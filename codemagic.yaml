# Codemagic CI/CD — Crafters Market iOS (Capacitor)
# Repo layout: Capacitor project lives in ./ios, Xcode project in ./ios/ios/App
# Docs: /app/docs/IOS_BUILD_GUIDE.md  (section "Building without a Mac — Codemagic")

workflows:
  ios-testflight:
    name: Crafters Market iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Name of the App Store Connect API key you add in
      # Codemagic → Teams → Integrations → Developer Portal (name it exactly "codemagic")
      app_store_connect: codemagic
    environment:
      groups:
        # Must contain secret var CERTIFICATE_PRIVATE_KEY (see IOS_BUILD_GUIDE.md)
        - appstore_credentials
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        APP_NAME: "Crafters Market"
        BUNDLE_ID: "org.craftersmarket.app"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Install Capacitor JS dependencies
        script: |
          cd ios
          npm install
      - name: Sync Capacitor iOS project (copies config, updates plugins)
        script: |
          cd ios
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/ios/App
          pod install
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch or CREATE App Store signing files (cert + provisioning profile)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Apply Apple code signing profiles
        script: |
          xcode-project use-profiles
      - name: Set incrementing build number
        script: |
          cd ios/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads every successful build to TestFlight automatically.
        submit_to_testflight: true
        # Flip to true later to auto-submit for App Store review:
        submit_to_app_store: false

  # Manual/branch builds without TestFlight upload (for quick validation)
  ios-build-only:
    name: Crafters Market iOS (build only, no upload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - appstore_credentials
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "org.craftersmarket.app"
    scripts:
      - name: Install Capacitor JS dependencies
        script: |
          cd ios
          npm install
      - name: Sync Capacitor iOS project
        script: |
          cd ios
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/ios/App
          pod install
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch or CREATE App Store signing files (cert + provisioning profile)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Apply Apple code signing profiles
        script: |
          xcode-project use-profiles
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
