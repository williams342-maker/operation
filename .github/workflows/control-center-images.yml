name: Control Center Images

# Forge milestone 5 — see control-center/docs/forge-manifest-spec.md §2.1.
#
# Builds the control-center backend and frontend images from an exact annotated tag, stamps the
# provenance labels the deployment preflight reads, and OPTIONALLY publishes and attests them.
#
# DELIBERATELY workflow_dispatch ONLY, and `publish` DEFAULTS TO FALSE.
#
# Publishing container images and creating a build-provenance attestation are outward, permanent acts:
# the image lands in a public registry and the attestation lands in a public transparency log. Neither
# should happen because someone pushed a tag. With `publish: false` this workflow builds, stamps, and
# reports — it pushes nothing, attests nothing, and needs no registry credential. A human turns it on,
# per run, on purpose.
#
# This mirrors the discipline the release workflow already follows: it creates a DRAFT prerelease and a
# human publishes it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated prerelease tag to build images from
        required: true
        type: string
      publish:
        description: "Push images to GHCR and create build-provenance attestations. Outward and permanent — leave false to build and report only."
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    # A protected environment is what makes the publish decision STRUCTURAL rather than conventional.
    # `workflow_dispatch` plus a boolean input only proves someone with dispatch permission set a flag;
    # it does not prove a human approved a publish. Configure `image-publish` in repository settings
    # with required reviewers — until that is done, a publish run waits for an approval that no one can
    # grant, which is the correct failure direction.
    environment: ${{ inputs.publish && 'image-publish' || '' }}
    # Job-level, so EVERY step reads the untrusted tag from the environment. The previous fix moved only
    # the one step an independent review happened to cite, leaving `${{ inputs.tag }}` interpolated into
    # two other `run:` bodies — fixing the instance instead of the class, in a job holding id-token,
    # attestations and packages write.
    env:
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_PUBLISH: ${{ inputs.publish }}
      REPOSITORY: ${{ github.repository }}
    defaults:
      run:
        working-directory: control-center
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Resolve and validate the source identity
        id: source
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*-*) ;;
            *) echo "Tag must be an exact semantic-version prerelease tag" >&2; exit 1 ;;
          esac
          test "$(git cat-file -t "$tag")" = "tag" || { echo "Tag must be annotated" >&2; exit 1; }
          commit="$(git rev-parse "${tag}^{commit}")"
          test "$(git rev-parse HEAD)" = "$commit" || { echo "Checkout does not match the tag" >&2; exit 1; }
          # The tree as well as the commit: a rewritten history can reuse a commit message and author
          # while carrying a different tree.
          {
            echo "commit=$commit"
            echo "tree=$(git rev-parse "${tag}^{tree}")"
            echo "created=$(git show -s --format=%cI "$commit")"
            echo "repository=${{ github.server_url }}/${{ github.repository }}"
          } >> "$GITHUB_OUTPUT"

      - name: Report what will be built
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          {
            echo "### Control Center images"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| tag | \`$INPUT_TAG\` |"
            echo "| commit | \`$SOURCE_COMMIT\` |"
            echo "| tree | \`$SOURCE_TREE\` |"
            echo "| publish | \`$INPUT_PUBLISH\` |"
            echo ""
            if [ "$INPUT_PUBLISH" != "true" ]; then
              echo "Build-only run. Nothing was pushed and nothing was attested."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      # Gated: pushing requires a registry credential, so do not even authenticate on a build-only run.
      - name: Log in to the container registry
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: control-center
          file: control-center/apps/api/Dockerfile
          push: ${{ inputs.publish }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/control-center-api:${{ inputs.tag }}
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
            SOURCE_TREE=${{ steps.source.outputs.tree }}
            SOURCE_REPOSITORY=${{ steps.source.outputs.repository }}
            SOURCE_TAG=${{ inputs.tag }}
            BUILD_CREATED=${{ steps.source.outputs.created }}

      - name: Build the web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: control-center
          file: control-center/apps/web/Dockerfile
          push: ${{ inputs.publish }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/control-center-web:${{ inputs.tag }}
          build-args: |
            VITE_API_URL=/api
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
            SOURCE_TREE=${{ steps.source.outputs.tree }}
            SOURCE_REPOSITORY=${{ steps.source.outputs.repository }}
            SOURCE_TAG=${{ inputs.tag }}
            BUILD_CREATED=${{ steps.source.outputs.created }}

      # Verifies the mechanism this whole milestone exists for: the label the deployment preflight reads
      # must equal the commit the image was built from. Runs on every invocation, published or not, so a
      # build-only run still proves the provenance stamp works.
      - name: Verify the provenance labels
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          expected="$SOURCE_COMMIT"
          for image in \
            "${REGISTRY}/${REPOSITORY}/control-center-api:${INPUT_TAG}" \
            "${REGISTRY}/${REPOSITORY}/control-center-web:${INPUT_TAG}"; do
            revision="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            tree="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opsworkbench.source.tree" }}')"
            test "$revision" = "$expected" || { echo "$image revision label $revision != $expected" >&2; exit 1; }
            test "$tree" = "$SOURCE_TREE" || { echo "$image tree label mismatch" >&2; exit 1; }
            echo "$image -> revision $revision, tree $tree"
          done

      # Gated: an attestation is a permanent public transparency-log entry.
      - name: Attest the API image
        if: inputs.publish
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/control-center-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Attest the web image
        if: inputs.publish
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/control-center-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Record the published digests
        if: inputs.publish
        run: |
          {
            echo ""
            echo "Published and attested:"
            echo ""
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| control-center-api | \`${{ steps.api.outputs.digest }}\` |"
            echo "| control-center-web | \`${{ steps.web.outputs.digest }}\` |"
            echo ""
            echo "These digests are what a \`forge-build-v1\` document pins as \`backendImageDigest\` and \`frontendImageDigest\`."
          } >> "$GITHUB_STEP_SUMMARY"
