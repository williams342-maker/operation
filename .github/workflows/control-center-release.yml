name: Control Center Release

on:
  push:
    tags:
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated prerelease tag to package
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-center
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Scan exact tagged tree with Gitleaks 8.30.1
        working-directory: .
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tool_dir="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          scan_dir="${RUNNER_TEMP}/gitleaks-release-tree"
          mkdir -p "$tool_dir" "$scan_dir"
          curl --fail --location --silent --show-error --output "${RUNNER_TEMP}/${asset}" "${release_url}/${asset}"
          curl --fail --location --silent --show-error --output "${RUNNER_TEMP}/gitleaks-checksums.txt" "${release_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" "${RUNNER_TEMP}/gitleaks-checksums.txt" > "${RUNNER_TEMP}/gitleaks-checksum.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check gitleaks-checksum.txt)
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "$tool_dir" gitleaks
          git archive --format=tar HEAD | tar -xf - -C "$scan_dir"
          "$tool_dir/gitleaks" dir "$scan_dir" --no-banner --redact --exit-code 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-center/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build --workspaces --if-present
      - name: Build deterministic deployment bundle twice
        run: bash scripts/verify-release-artifacts.sh
      - name: Build publishable deployment bundle
        run: bash scripts/build-release-artifacts.sh
      - name: Attest deployment bundle provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release-output/opsworkbench-control-center-*.tar.gz
            release-output/opsworkbench-control-center-*.manifest.json
            release-output/SHA256SUMS
      - name: Upload signed workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: opsworkbench-control-center-${{ env.RELEASE_TAG }}
          path: release-output/
          if-no-files-found: error
          compression-level: 0
      - name: Create draft prerelease and attach reviewed assets
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
            --title "OpsWorkbench ${RELEASE_TAG#v}" \
            --notes "Deterministic deployment bundle built from the exact annotated tag. Verify SHA256SUMS and GitHub build-provenance attestations before publishing this immutable prerelease."
          gh release upload "$RELEASE_TAG" release-output/* --clobber=false
      - name: Verify tracked repository integrity
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          git diff --check
          git diff --quiet --ignore-submodules --
          git diff --cached --quiet --ignore-submodules --
