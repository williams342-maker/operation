name: Control Center Deployment Rehearsal

on:
  workflow_dispatch:
    inputs:
      candidate_tag: { description: "Exact annotated candidate tag", required: true, type: string }
      rollback_tag: { description: "Exact annotated rollback tag", required: true, type: string }

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Pin both exact annotated sources
        id: source
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$CANDIDATE_TAG"
          for tag in "$CANDIDATE_TAG" "$ROLLBACK_TAG"; do
            test "$(git cat-file -t "$tag")" = tag
            git merge-base --is-ancestor "${tag}^{commit}" origin/main
          done
          candidate="$(git rev-list -n1 "$CANDIDATE_TAG")"
          rollback="$(git rev-list -n1 "$ROLLBACK_TAG")"
          test "$candidate" != "$rollback"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "rollback=$rollback" >> "$GITHUB_OUTPUT"
          git worktree add --detach ../rollback-source "$ROLLBACK_TAG"
      - name: Build exact candidate and rollback images locally
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          CANDIDATE_COMMIT: ${{ steps.source.outputs.candidate }}
          ROLLBACK_COMMIT: ${{ steps.source.outputs.rollback }}
        run: |
          set -euo pipefail
          build_set() {
            root="$1"; label="$2"; commit="$3"; tag="$4"; tree="$(git -C "$root" show -s --format=%T "$commit")"
            docker build "$root/control-center" -f "$root/control-center/apps/api/Dockerfile" -t "rehearsal-api:$label" --build-arg SOURCE_COMMIT="$commit" --build-arg SOURCE_TREE="$tree" --build-arg SOURCE_TAG="$tag"
            docker build "$root/control-center" -f "$root/control-center/apps/web/Dockerfile" -t "rehearsal-web:$label" --build-arg VITE_API_URL=/api --build-arg SOURCE_COMMIT="$commit" --build-arg SOURCE_TREE="$tree" --build-arg SOURCE_TAG="$tag"
            docker build "$root/control-center" -f "$root/control-center/apps/web/Dockerfile.admin" -t "rehearsal-admin:$label" --build-arg VITE_API_URL=/api --build-arg SOURCE_COMMIT="$commit" --build-arg SOURCE_TREE="$tree" --build-arg SOURCE_TAG="$tag"
            docker build "$root/control-center" -f "$root/control-center/apps/review-gate/Dockerfile" -t "rehearsal-gate:$label" --build-arg SOURCE_COMMIT="$commit" --build-arg SOURCE_TREE="$tree" --build-arg SOURCE_TAG="$tag"
          }
          build_set . candidate "$CANDIDATE_COMMIT" "$CANDIDATE_TAG"
          build_set ../rollback-source rollback "$ROLLBACK_COMMIT" "$ROLLBACK_TAG"
      - name: Exercise forward, rollback, partial switch and restart against a replica set
        env:
          CANDIDATE_COMMIT: ${{ steps.source.outputs.candidate }}
          ROLLBACK_COMMIT: ${{ steps.source.outputs.rollback }}
        run: |
          set -euo pipefail
          network="rehearsal-${GITHUB_RUN_ID}"
          docker network create "$network"
          docker run -d --name rehearsal-mongo --network "$network" mongo:8.0 mongod --bind_ip_all --replSet rs0
          for i in $(seq 1 30); do docker exec rehearsal-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 && break; sleep 1; done
          docker exec rehearsal-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"rehearsal-mongo:27017"}]})'
          for i in $(seq 1 30); do docker exec rehearsal-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break; sleep 1; done
          mkdir -m 700 tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=review-gate -addext 'subjectAltName=DNS:review-gate,IP:127.0.0.1' -keyout tls/tls.key -out tls/tls.crt >/dev/null 2>&1
          chmod 644 tls/tls.key tls/tls.crt
          start_set() {
            label="$1"
            docker run -d --name "api-$label" --network "$network" -e NODE_ENV=development -e MONGO_URL='mongodb://rehearsal-mongo:27017/control_center_rehearsal?replicaSet=rs0' "rehearsal-api:$label"
            docker run -d --name "gate-$label" --network "$network" -v "$PWD/tls:/run/tls:ro" -e REVIEW_GATE_MONGO_URL='mongodb://rehearsal-mongo:27017/review_gate_rehearsal?replicaSet=rs0' -e REVIEW_GATE_DB_NAME=review_gate_rehearsal -e REVIEW_GATE_BIND=0.0.0.0 -e REVIEW_GATE_TLS_CERTIFICATE_PATH=/run/tls/tls.crt -e REVIEW_GATE_TLS_PRIVATE_KEY_PATH=/run/tls/tls.key "rehearsal-gate:$label"
            docker run -d --name "web-$label" --network "$network" "rehearsal-web:$label"
            docker run -d --name "admin-$label" --network "$network" "rehearsal-admin:$label"
            for name in api gate web admin; do for i in $(seq 1 30); do test "$(docker inspect -f '{{.State.Health.Status}}' "$name-$label")" = healthy && break; sleep 1; done; test "$(docker inspect -f '{{.State.Health.Status}}' "$name-$label")" = healthy; done
            docker run --rm --network "$network" curlimages/curl:8.16.0 --fail --silent "http://api-$label:3000/readyz" >/dev/null
            docker run --rm --network "$network" curlimages/curl:8.16.0 --fail --silent --insecure "https://gate-$label:3100/healthz" | grep -q 'ENFORCEMENT IS NOT ACTIVE'
          }
          stop_set() { for name in api gate web admin; do docker rm -f "$name-$1" >/dev/null; done; }
          start_set candidate
          stop_set candidate
          start_set rollback
          docker restart rehearsal-mongo >/dev/null
          for i in $(seq 1 30); do docker exec rehearsal-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break; sleep 1; done
          docker restart api-rollback gate-rollback >/dev/null
          for name in api gate; do for i in $(seq 1 30); do test "$(docker inspect -f '{{.State.Health.Status}}' "$name-rollback")" = healthy && break; sleep 1; done; test "$(docker inspect -f '{{.State.Health.Status}}' "$name-rollback")" = healthy; done
          docker rm -f api-rollback >/dev/null
          docker run -d --name api-candidate --network "$network" -e NODE_ENV=development -e MONGO_URL='mongodb://rehearsal-mongo:27017/control_center_rehearsal?replicaSet=rs0' rehearsal-api:candidate
          for i in $(seq 1 30); do test "$(docker inspect -f '{{.State.Health.Status}}' api-candidate)" = healthy && break; sleep 1; done
          test "$(docker inspect -f '{{.State.Health.Status}}' api-candidate)" = healthy
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' api-candidate)" = "$CANDIDATE_COMMIT"
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' gate-rollback)" = "$ROLLBACK_COMMIT"
      - name: Run real replica-set authority and transaction suites
        working-directory: control-center
        env:
          REVIEW_GATE_TEST_MONGO_URL: mongodb://localhost:27017/?replicaSet=rs0
          MONGO_URL_TEST: mongodb://localhost:27017/control_center_test_rehearsal?replicaSet=rs0
          CONTROL_CENTER_RUN_DB_TESTS: "true"
        run: |
          set -euo pipefail
          docker run -d --name rehearsal-test-mongo -p 27017:27017 mongo:8.0 mongod --bind_ip_all --replSet rs0
          for i in $(seq 1 30); do docker exec rehearsal-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 && break; sleep 1; done
          docker exec rehearsal-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do docker exec rehearsal-test-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break; sleep 1; done
          npm ci --ignore-scripts
          npm run build --workspace @control-center/shared
          npx tsx --test apps/review-gate/test/mongoStore.test.ts apps/review-gate/test/mongoTransaction.test.ts
          npx tsx --test apps/api/test/dbApiIntegration.test.ts
      - name: Prove migration boundary and emit exact evidence
        working-directory: control-center
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_COMMIT: ${{ steps.source.outputs.candidate }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          ROLLBACK_COMMIT: ${{ steps.source.outputs.rollback }}
          MIGRATIONS_PRESENT: "false"
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");for(const p of ["package.json",...fs.readdirSync("apps").map(x=>`apps/${x}/package.json`)]){if(!fs.existsSync(p))continue;const s=JSON.parse(fs.readFileSync(p));if(Object.keys(s.scripts||{}).some(k=>/^migrat/.test(k)))process.exit(1)}' 
          test ! -d migrations
          node scripts/build-rehearsal-evidence.mjs schema-rehearsal.json
      - name: Attest the rehearsal evidence
        uses: actions/attest-build-provenance@v3
        with: { subject-path: control-center/schema-rehearsal.json }
      - uses: actions/upload-artifact@v6
        with:
          name: schema-rehearsal-${{ inputs.candidate_tag }}-from-${{ inputs.rollback_tag }}
          path: control-center/schema-rehearsal.json
          if-no-files-found: error
      - name: Remove isolated rehearsal resources
        if: always()
        run: |
          docker ps -aq --filter 'name=^rehearsal-' | xargs -r docker rm -f
          docker network ls -q --filter "name=rehearsal-${GITHUB_RUN_ID}" | xargs -r docker network rm
