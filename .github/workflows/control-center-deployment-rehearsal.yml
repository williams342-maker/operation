name: Control Center Deployment Rehearsal

on:
  workflow_dispatch:
    inputs:
      candidate_tag: { description: "Exact annotated candidate tag", required: true, type: string }
      rollback_tag: { description: "Exact annotated rollback tag", required: true, type: string }

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0, fetch-tags: true }
      - name: Pin both exact annotated sources
        id: source
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-operate$ ]]
          [[ "$ROLLBACK_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-operate$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/tags/$CANDIDATE_TAG"
          for tag in "$CANDIDATE_TAG" "$ROLLBACK_TAG"; do
            test "$(git cat-file -t "$tag")" = tag
            git merge-base --is-ancestor "${tag}^{commit}" origin/main
          done
          candidate="$(git rev-list -n1 "$CANDIDATE_TAG")"
          rollback="$(git rev-list -n1 "$ROLLBACK_TAG")"
          test "$candidate" != "$rollback"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "rollback=$rollback" >> "$GITHUB_OUTPUT"
          echo "candidate_created=$(git show -s --format=%cI "$candidate")" >> "$GITHUB_OUTPUT"
          echo "rollback_created=$(git show -s --format=%cI "$rollback")" >> "$GITHUB_OUTPUT"
          git worktree add --detach ../rollback-source "$ROLLBACK_TAG"
      - name: Build exact candidate and rollback images locally
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          CANDIDATE_COMMIT: ${{ steps.source.outputs.candidate }}
          ROLLBACK_COMMIT: ${{ steps.source.outputs.rollback }}
          CANDIDATE_CREATED: ${{ steps.source.outputs.candidate_created }}
          ROLLBACK_CREATED: ${{ steps.source.outputs.rollback_created }}
        run: |
          set -euo pipefail
          build_set() {
            root="$1"; label="$2"; commit="$3"; tag="$4"; created="$5"; tree="$(git -C "$root" show -s --format=%T "$commit")"
            common=(--build-arg SOURCE_COMMIT="$commit" --build-arg SOURCE_TREE="$tree" --build-arg SOURCE_TAG="$tag" --build-arg BUILD_CREATED="$created")
            docker build "$root/control-center" -f "$root/control-center/apps/api/Dockerfile" -t "rehearsal-api:$label" "${common[@]}"
            docker build "$root/control-center" -f "$root/control-center/apps/web/Dockerfile" -t "rehearsal-web:$label" --build-arg VITE_API_URL=/api "${common[@]}"
            docker build "$root/control-center" -f "$root/control-center/apps/web/Dockerfile.admin" -t "rehearsal-admin:$label" --build-arg VITE_API_URL=/api "${common[@]}"
            docker build "$root/control-center" -f "$root/control-center/apps/review-gate/Dockerfile" -t "rehearsal-gate:$label" "${common[@]}"
          }
          build_set . candidate "$CANDIDATE_COMMIT" "$CANDIDATE_TAG" "$CANDIDATE_CREATED"
          build_set ../rollback-source rollback "$ROLLBACK_COMMIT" "$ROLLBACK_TAG" "$ROLLBACK_CREATED"
          mkdir .rehearsal-proof
          for set in candidate rollback; do
            for role in api web admin gate; do
              variable="$(printf '%s_%s_IMAGE_ID' "$set" "$role" | tr '[:lower:]' '[:upper:]')"
              id="$(docker image inspect "rehearsal-${role}:${set}" --format '{{.Id}}')"
              test "${id#sha256:}" != "$id"
              echo "${variable}=${id}" >> "$GITHUB_ENV"
            done
          done
      - name: Exercise forward, rollback, partial switch and restart against a replica set
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          CANDIDATE_COMMIT: ${{ steps.source.outputs.candidate }}
          ROLLBACK_COMMIT: ${{ steps.source.outputs.rollback }}
        run: |
          set -euo pipefail
          network="rehearsal-${GITHUB_RUN_ID}"
          docker network create "$network"
          docker run -d --name rehearsal-mongo --network "$network" mongo@sha256:02a0cc7939f5ed38f30f9bc714ef5f682d49baf9350c54acf302ce833087fe8a mongod --bind_ip_all --replSet rs0
          for i in $(seq 1 30); do docker exec rehearsal-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 && break; sleep 1; done
          docker exec rehearsal-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"rehearsal-mongo:27017"}]})'
          for i in $(seq 1 30); do docker exec rehearsal-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break; sleep 1; done
          umask 077
          mkdir -m 755 tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=review-gate -addext 'subjectAltName=DNS:review-gate,DNS:gate-candidate,DNS:gate-rollback,IP:127.0.0.1' -keyout tls/tls.key -out tls/tls.crt >/dev/null 2>&1
          chmod 600 tls/tls.key; sudo chown 1000:1000 tls/tls.key; chmod 644 tls/tls.crt
          start_set() {
            label="$1"
            prefix="$(printf '%s' "$label" | tr '[:lower:]' '[:upper:]')"
            api_variable="${prefix}_API_IMAGE_ID"; API_IMAGE_ID="${!api_variable}"
            web_variable="${prefix}_WEB_IMAGE_ID"; WEB_IMAGE_ID="${!web_variable}"
            admin_variable="${prefix}_ADMIN_IMAGE_ID"; ADMIN_IMAGE_ID="${!admin_variable}"
            gate_variable="${prefix}_GATE_IMAGE_ID"; GATE_IMAGE_ID="${!gate_variable}"
            docker run -d --name "api-$label" --network "$network" -e NODE_ENV=development -e MONGO_URL='mongodb://rehearsal-mongo:27017/control_center_rehearsal?replicaSet=rs0' "$API_IMAGE_ID"
            docker run -d --name "gate-$label" --network "$network" -v "$PWD/tls:/run/tls:ro" -e REVIEW_GATE_MONGO_URL='mongodb://rehearsal-mongo:27017/review_gate_rehearsal?replicaSet=rs0' -e REVIEW_GATE_DB_NAME=review_gate_rehearsal -e REVIEW_GATE_BIND=0.0.0.0 -e REVIEW_GATE_TLS_CERTIFICATE_PATH=/run/tls/tls.crt -e REVIEW_GATE_TLS_PRIVATE_KEY_PATH=/run/tls/tls.key "$GATE_IMAGE_ID"
            docker run -d --name "web-$label" --network "$network" "$WEB_IMAGE_ID"
            docker run -d --name "admin-$label" --network "$network" "$ADMIN_IMAGE_ID"
            for name in api gate web admin; do for i in $(seq 1 90); do test "$(docker inspect -f '{{.State.Health.Status}}' "$name-$label")" = healthy && break; sleep 1; done; test "$(docker inspect -f '{{.State.Health.Status}}' "$name-$label")" = healthy; done
            docker run --rm --network "$network" curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6 --fail --silent "http://api-$label:3000/readyz" >/dev/null
            docker run --rm --network "$network" -v "$PWD/tls:/tls:ro" curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6 --fail --silent --cacert /tls/tls.crt "https://gate-$label:3100/healthz" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.ok!==true||typeof x.advisory!=="string"||!x.advisory.length)process.exit(1)})'
          }
          stop_set() { for name in api gate web admin; do docker rm -f "$name-$1" >/dev/null; done; }
          start_set candidate
          docker exec rehearsal-mongo mongosh --quiet control_center_rehearsal --eval 'db.rehearsal_state.insertOne({_id:"candidate-write",schema:"unchanged",source:"candidate"})' >/dev/null
          docker exec rehearsal-mongo mongosh --quiet review_gate_rehearsal --eval 'db.rehearsal_state.insertOne({_id:"candidate-write",schema:"unchanged",source:"candidate"})' >/dev/null
          printf 'passed\n' > .rehearsal-proof/forward_compatibility
          stop_set candidate
          start_set rollback
          test "$(docker exec rehearsal-mongo mongosh --quiet control_center_rehearsal --eval 'db.rehearsal_state.countDocuments({_id:"candidate-write"})')" = 1
          test "$(docker exec rehearsal-mongo mongosh --quiet review_gate_rehearsal --eval 'db.rehearsal_state.countDocuments({_id:"candidate-write"})')" = 1
          for role in api web admin gate; do
            candidate_variable="CANDIDATE_$(printf '%s' "$role" | tr '[:lower:]' '[:upper:]')_IMAGE_ID"; rollback_variable="ROLLBACK_$(printf '%s' "$role" | tr '[:lower:]' '[:upper:]')_IMAGE_ID"
            test "$(docker inspect -f '{{.Image}}' "$role-rollback")" = "${!rollback_variable}"
            docker image inspect "${!candidate_variable}" "${!rollback_variable}" >/dev/null
            test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$role-rollback")" = "$ROLLBACK_COMMIT"
          done
          test "$(git -C ../rollback-source rev-parse HEAD)" = "$ROLLBACK_COMMIT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          printf 'passed\n' > .rehearsal-proof/predecessor_artifacts_retained
          printf 'passed\n' > .rehearsal-proof/rollback_immutable_images
          printf 'passed\n' > .rehearsal-proof/rollback_compatibility
          test "$(git cat-file -t "$ROLLBACK_TAG")" = tag
          test "$(git rev-list -n1 "$ROLLBACK_TAG")" = "$ROLLBACK_COMMIT"
          printf 'passed\n' > .rehearsal-proof/rollback_target_independently_verified
          docker restart rehearsal-mongo >/dev/null
          for i in $(seq 1 30); do docker exec rehearsal-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break; sleep 1; done
          docker restart api-rollback gate-rollback >/dev/null
          for name in api gate; do for i in $(seq 1 90); do test "$(docker inspect -f '{{.State.Health.Status}}' "$name-rollback")" = healthy && break; sleep 1; done; test "$(docker inspect -f '{{.State.Health.Status}}' "$name-rollback")" = healthy; done
          printf 'passed\n' > .rehearsal-proof/service_restart_during_transition
          docker rm -f api-rollback >/dev/null
          docker run -d --name api-candidate --network "$network" -e NODE_ENV=development -e MONGO_URL='mongodb://rehearsal-mongo:27017/control_center_rehearsal?replicaSet=rs0' "$CANDIDATE_API_IMAGE_ID"
          for i in $(seq 1 90); do test "$(docker inspect -f '{{.State.Health.Status}}' api-candidate)" = healthy && break; sleep 1; done
          test "$(docker inspect -f '{{.State.Health.Status}}' api-candidate)" = healthy
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' api-candidate)" = "$CANDIDATE_COMMIT"
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' gate-rollback)" = "$ROLLBACK_COMMIT"
          docker rm -f api-candidate >/dev/null
          docker run -d --name api-rollback --network "$network" -e NODE_ENV=development -e MONGO_URL='mongodb://rehearsal-mongo:27017/control_center_rehearsal?replicaSet=rs0' "$ROLLBACK_API_IMAGE_ID"
          for i in $(seq 1 90); do test "$(docker inspect -f '{{.State.Health.Status}}' api-rollback)" = healthy && break; sleep 1; done
          test "$(docker inspect -f '{{.State.Health.Status}}' api-rollback)" = healthy
          test "$(docker inspect -f '{{.State.Health.Status}}' gate-rollback)" = healthy
          test "$(docker inspect -f '{{.Image}}' api-rollback)" = "$ROLLBACK_API_IMAGE_ID"
          docker run --rm --network "$network" curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6 --fail --silent http://api-rollback:3000/readyz >/dev/null
          docker run --rm --network "$network" -v "$PWD/tls:/tls:ro" curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6 --fail --silent --cacert /tls/tls.crt https://gate-rollback:3100/healthz | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.ok!==true||typeof x.advisory!=="string"||!x.advisory.length)process.exit(1)})'
          printf 'passed\n' > .rehearsal-proof/rollback_after_partial_switch
      - name: Run real replica-set authority and transaction suites
        working-directory: control-center
        env:
          REVIEW_GATE_TEST_MONGO_URL: mongodb://localhost:27017/?replicaSet=rs0
          MONGO_URL_TEST: mongodb://localhost:27017/control_center_test_rehearsal?replicaSet=rs0
          CONTROL_CENTER_RUN_DB_TESTS: "true"
        run: |
          set -euo pipefail
          docker run -d --name rehearsal-test-mongo -p 27017:27017 mongo@sha256:02a0cc7939f5ed38f30f9bc714ef5f682d49baf9350c54acf302ce833087fe8a mongod --bind_ip_all --replSet rs0
          for i in $(seq 1 30); do docker exec rehearsal-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 && break; sleep 1; done
          docker exec rehearsal-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do docker exec rehearsal-test-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break; sleep 1; done
          npm ci --ignore-scripts
          npm run build --workspace @control-center/shared
          npx tsx --test apps/review-gate/test/mongoStore.test.ts apps/review-gate/test/mongoTransaction.test.ts
          npx tsx --test apps/api/test/dbApiIntegration.test.ts
      - name: Prove migration boundary and emit exact evidence
        working-directory: control-center
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_COMMIT: ${{ steps.source.outputs.candidate }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          ROLLBACK_COMMIT: ${{ steps.source.outputs.rollback }}
          MIGRATIONS_PRESENT: "false"
          REHEARSAL_PROOF_DIR: ${{ github.workspace }}/.rehearsal-proof
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");for(const p of ["package.json",...fs.readdirSync("apps").map(x=>`apps/${x}/package.json`)]){if(!fs.existsSync(p))continue;const s=JSON.parse(fs.readFileSync(p));if(Object.keys(s.scripts||{}).some(k=>/^migrat/.test(k)))process.exit(1)}' 
          test ! -d migrations
          node -e 'const fs=require("fs");const root=`${process.env.GITHUB_WORKSPACE}/../rollback-source/control-center`;for(const p of [`${root}/package.json`,...fs.readdirSync(`${root}/apps`).map(x=>`${root}/apps/${x}/package.json`)]){if(!fs.existsSync(p))continue;const s=JSON.parse(fs.readFileSync(p));if(Object.keys(s.scripts||{}).some(k=>/^migrat/.test(k)))process.exit(1)}'
          test ! -d "$GITHUB_WORKSPACE/../rollback-source/control-center/migrations"
          node scripts/build-rehearsal-evidence.mjs schema-rehearsal.json
      - name: Attest the rehearsal evidence
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with: { subject-path: control-center/schema-rehearsal.json }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: schema-rehearsal-${{ inputs.candidate_tag }}-from-${{ inputs.rollback_tag }}
          path: control-center/schema-rehearsal.json
          if-no-files-found: error
      - name: Remove isolated rehearsal resources
        if: always()
        run: |
          docker ps -aq --filter "network=rehearsal-${GITHUB_RUN_ID}" | xargs -r docker rm -f
          docker ps -aq --filter 'name=^rehearsal-test-mongo$' | xargs -r docker rm -f
          docker network ls -q --filter "name=rehearsal-${GITHUB_RUN_ID}" | xargs -r docker network rm
