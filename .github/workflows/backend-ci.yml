# Backend CI — the first CI this component has ever had.
#
# `backend/` holds 392 test files and 2331 collected tests, and until now NO workflow referenced
# backend/, pytest, requirements, setup-python or pip. Every backend change — including three
# dependency PRs merged on 2026-09-01 — was landing with a green tick that verified nothing about it.
#
# THIS JOB DOES NOT GATE MERGES YET, AND THAT IS DELIBERATE.
#
# The suite's pass rate is unknown. It could not be established locally, because pytest.ini documents
# that motor's AsyncIOMotorClient is constructed at IMPORT TIME in core.py, so essentially every test
# file needs a reachable MongoDB just to be collected — a machine without one hangs in asyncio rather
# than failing. This job is therefore a MEASUREMENT first: it runs the suite, records the numbers, and
# publishes them, so the health of the suite becomes a fact instead of a guess.
#
# Promote it to a required check once the numbers are known and stable:
#   1. read the run summary for the real pass/fail/skip counts,
#   2. fix or quarantine what fails,
#   3. remove `continue-on-error` below,
#   4. add `backend-tests` to the required contexts in branch protection.
# Adding it as a required gate today would only pin a red check to every pull request.

name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    # Measurement, not a gate. See the header. Remove this line to promote it.
    continue-on-error: true
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: backend_ci_test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # 3.12, not 3.13: dependency resolution rejects some pinned packages that cap at
          # Requires-Python <3.13.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # emergentintegrations==0.1.0 is NOT on PyPI — it is vendored at backend/emergentintegrations/,
        # so `pip install -r requirements.txt` fails outright on a clean machine. Filtering the pin lets
        # the install succeed while the vendored package stays importable from the working directory.
        # That is a workaround for a real packaging defect, not a fix for it.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install pytest-timeout

      - name: Recreate the container paths the tests hardcode
        # 103 test files do `open("/app/frontend/.env")` at MODULE level and 197 call
        # `load_dotenv("/app/backend/.env")` — absolute paths from the original Emergent container
        # layout. The open() raises FileNotFoundError during COLLECTION, so 76 files fail before a
        # single assertion runs. The tests read REACT_APP_BACKEND_URL from that file and fall back to
        # http://localhost:8001 when the key is absent, so an empty file is enough to make them
        # collect.
        #
        # This reproduces the layout rather than editing 103 test files. The real fix is to resolve
        # those paths relative to the repository; that is a separate change, and a large one.
        run: |
          set -euo pipefail
          sudo mkdir -p /app/frontend /app/backend
          sudo touch /app/frontend/.env /app/backend/.env
          sudo chmod -R a+rw /app

      - name: Run the test suite
        # --timeout guards against the import-time motor client hanging on a connection rather than
        # failing, which is how this suite behaves with no MongoDB reachable.
        # `|| true` keeps the measurement steps below running on failure; the real outcome is reported
        # from the JUnit XML.
        run: |
          set -uo pipefail
          pytest -q --timeout=60 --junitxml=/tmp/backend-junit.xml -p no:cacheprovider || true

      - name: Publish the numbers
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib
          p = pathlib.Path("/tmp/backend-junit.xml")
          print("### Backend test suite\n")
          if not p.exists():
              print("No JUnit report was produced — the run failed before any test executed.")
              raise SystemExit(0)
          r = ET.parse(p).getroot()
          s = r if r.tag == "testsuite" else (r.find("testsuite") or r)
          get = lambda k: int(s.get(k) or 0)
          total, fail, err, skip = get("tests"), get("failures"), get("errors"), get("skipped")
          print(f"| metric | count |\n| --- | --- |")
          print(f"| collected | {total} |")
          print(f"| passed | {total - fail - err - skip} |")
          print(f"| failed | {fail} |")
          print(f"| errored | {err} |")
          print(f"| skipped | {skip} |")
          print("\nThis job does not gate merges yet. Promote it once these numbers are stable — see the workflow header.")
          PY

      - name: Retain the JUnit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-junit
          path: /tmp/backend-junit.xml
          if-no-files-found: warn
