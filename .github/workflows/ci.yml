# Named distinctly from control-center-ci.yml, which is ALSO called "Control Center CI".
#
# Both workflows had a job id `verify` and no explicit job name, so both emitted a status check called
# `verify` — and branch protection requires the single context "verify". Two different pipelines were
# answering to one required name: a pull request could show a passing `verify` beside a failing `verify`
# with nothing in the UI to tell them apart, and the log had to be opened to find out which pipeline had
# actually failed. That happened on #28 and again on #36.
#
# This job is the LIGHTER of the two - it runs the MongoDB suite, the coverage count, typecheck, lint and
# build. control-center-ci.yml additionally runs Gitleaks, the dependency audit, shell verification, the
# agent upgrade dry run, Playwright end-to-end tests and a repository integrity check. So `verify` is
# deliberately left to that workflow: the required context now resolves to the COMPREHENSIVE gate rather
# than to whichever of the two GitHub happened to pick.
#
# Consequence worth knowing: `quick-verify` is not in the required-checks list. It still runs and is still
# visible on every pull request, but it does not block a merge. Adding it would mostly duplicate work the
# comprehensive gate already does; if you want it enforced, add the `quick-verify` context in branch
# protection.
name: Control Center CI (quick)

on:
  pull_request:
  push:
    branches: [ main, checkpoint/local-dashboard-prototype, control-center-phase-1, "review/**" ]

jobs:
  verify:
    # The CHECK name comes from this, not from the workflow name. The job id stays `verify` so nothing
    # referencing it breaks; only the reported context changes.
    name: quick-verify
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: control-center
    env:
      CONTROL_CENTER_RUN_DB_TESTS: "true"
      MONGO_URL_TEST: mongodb://127.0.0.1:27017/control_center_test_ci
      # agent+api+shared "# tests" on linux with only RUN_DB_TESTS enabled: agent 64 + api 108 +
      # shared 79 = 249 (agent-v2 adds +15 shared: agentKeys 5 + agentProtocol 7 + v2-request 1 + taskEnvelopeV2 2, over reconciled
      # main's 222). Exactly 3 skip here: docker-deployment + two privileged linuxDiscovery tests.
      # Counts agent+api+shared only (the four-suite total lives in control-center-ci.yml).
      # api +10: buildIdentity now covers fail-closed behaviour and the measured runtime digest.
      CI_EXPECTED_TESTS: "276"
      CI_EXPECTED_SKIPS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-center/package-lock.json
      - run: npm ci
      - name: Test with disposable MongoDB
        run: npm test
      - name: Verify Linux test summary has expected coverage
        run: |
          set -euo pipefail
          node --import tsx --test --test-reporter=tap apps/agent/test/*.test.ts > agent.tap
          node --import tsx --test --test-reporter=tap apps/api/test/*.test.ts > api.tap
          node --import tsx --test --test-reporter=tap packages/shared/test/*.test.ts > shared.tap
          node - <<'NODE'
          const fs = require('node:fs');
          const files = ['agent.tap', 'api.tap', 'shared.tap'];
          let tests = 0;
          let skipped = 0;
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            tests += Number(text.match(/^# tests (\d+)/m)?.[1] ?? 0);
            skipped += Number(text.match(/^# skipped (\d+)/m)?.[1] ?? 0);
          }
          if (tests !== Number(process.env.CI_EXPECTED_TESTS)) throw new Error(`unexpected test count: ${tests}`);
          if (skipped !== Number(process.env.CI_EXPECTED_SKIPS)) throw new Error(`unexpected skipped tests: ${skipped}`);
          NODE
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build --workspaces --if-present
