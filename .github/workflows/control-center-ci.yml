name: Control Center CI

on:
  pull_request:
  push:
    branches: [ main, checkpoint/local-dashboard-prototype, control-center-phase-1 ]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: control-center
    env:
      CONTROL_CENTER_RUN_DB_TESTS: "true"
      MONGO_URL_TEST: mongodb://127.0.0.1:27017/control_center_test_ci
      CI_EXPECTED_TESTS: "25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-center/package-lock.json
      - run: npm ci
      - name: Test with disposable MongoDB
        run: npm test
      - name: Verify Linux test summary has no skips
        run: |
          set -euo pipefail
          npm test -- --test-reporter=json > test-report.jsonl
          node - <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync('test-report.jsonl', 'utf8').trim().split(/\n+/).filter((line) => line.trim().startsWith('{')).map((line) => JSON.parse(line));
          const summaries = lines.filter((line) => line.type === 'test:summary').map((line) => line.data);
          if (!summaries.length) throw new Error('missing test summaries');
          const totals = summaries.reduce((acc, item) => {
            acc.tests += item.tests ?? 0;
            acc.skipped += item.skipped ?? 0;
            acc.failures += item.failures ?? 0;
            return acc;
          }, { tests: 0, skipped: 0, failures: 0 });
          if (totals.tests !== Number(process.env.CI_EXPECTED_TESTS)) throw new Error(`unexpected test count: ${totals.tests}`);
          if (totals.skipped !== 0) throw new Error(`unexpected skipped tests: ${totals.skipped}`);
          if (totals.failures !== 0) throw new Error(`unexpected failed tests: ${totals.failures}`);
          NODE
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build --workspaces --if-present
