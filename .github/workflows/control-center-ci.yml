name: Control Center CI

on:
  workflow_dispatch:
  pull_request:
  push:
    # `review/**` absorbed from the deleted ci.yml, which was the only workflow triggering on it.
    branches: [ main, checkpoint/local-dashboard-prototype, control-center-phase-1, "validation/**", "fix/**", "review/**" ]

jobs:
  archive-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify checkout shell bytes on Windows
        run: node control-center/scripts/verify-shell-scripts.mjs
      - name: Build exact-commit deployment archive on Windows
        run: node control-center/scripts/build-deployment-archive.mjs --commit "${{ github.sha }}" --output archive-output
      - uses: actions/upload-artifact@v6
        with:
          name: deployment-archive-windows-${{ github.sha }}
          path: archive-output/
          if-no-files-found: error
          compression-level: 0

  archive-linux-verify:
    needs: archive-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: deployment-archive-windows-${{ github.sha }}
          path: archive-output
      - name: Verify Windows archive against Git blobs on Linux
        run: |
          set -euo pipefail
          archive="archive-output/opsworkbench-${GITHUB_SHA:0:12}.tar.gz"
          manifest="archive-output/opsworkbench-${GITHUB_SHA:0:12}.integrity.json"
          node control-center/scripts/verify-deployment-archive.mjs --archive "$archive" --manifest "$manifest"
          mkdir extracted
          tar -xzf "$archive" -C extracted
          bash -n extracted/control-center/apps/web/public/install.sh
          test "$(sha256sum extracted/control-center/apps/web/public/install.sh | cut -d' ' -f1)" = "$(git cat-file blob "$GITHUB_SHA:control-center/apps/web/public/install.sh" | sha256sum | cut -d' ' -f1)"

  # Absorbed from the deleted ci.yml, which was NOT redundant despite looking it.
  #
  # `verify` below runs with RUN_PRIVILEGED_FS_TESTS and RUN_DOCKER_DEPLOYMENT_TESTS enabled and requires
  # ZERO skips. This job runs the same suites with those capabilities DELIBERATELY ABSENT and requires
  # EXACTLY THREE skips. It is the only run that proves the capability-gated tests actually skip when the
  # capability is missing: a test that FAILED rather than skipped without Docker would sail through
  # `verify`, because Docker is present there.
  #
  # The duplicated parts of the old workflow - typecheck, lint, build - are not repeated here; `verify`
  # already covers them. What remains is only the coverage that existed nowhere else.
  quick-verify:
    # Check name kept stable so anyone watching `quick-verify` sees no change.
    name: quick-verify
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: control-center
    env:
      CONTROL_CENTER_RUN_DB_TESTS: "true"
      # PRIVILEGED_FS and DOCKER_DEPLOYMENT are intentionally NOT set. That absence is the point of this
      # job; setting them would make it a duplicate of `verify` and delete the coverage it exists for.
      MONGO_URL_TEST: mongodb://127.0.0.1:27017/control_center_test_ci
      # agent 140 + api 133 + shared 153 = 426, with exactly 3 skips: the docker-deployment test and two
      # privileged linuxDiscovery tests. Both numbers must move together when tests are added.
      # agent +5: the execution keeper, which an independent review found unimplemented rather than
      # merely untested, plus the in-flight shutdown race a second round found in the keeper itself.
      # agent +2 and shared +7: the payload serialization contract -- the executor digesting its own
      # parse and refusing a payload the schema rejects, and the pinned conformance vectors.
      CI_EXPECTED_TESTS: "426"
      CI_EXPECTED_SKIPS: "3"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-center/package-lock.json
      - run: npm ci
      # The agent and api suites import @control-center/shared by its BUILT output, so the dist must
      # exist before they can even load. The deleted ci.yml got this for free from `npm test`, whose
      # pretest builds it; dropping that step as "duplicated work" removed the build too and the suites
      # failed to import rather than running.
      - name: Build the shared package the suites import
        run: npm run build --workspace @control-center/shared
      - name: Verify capability-gated tests skip rather than fail when the capability is absent
        run: |
          set -euo pipefail
          node --import tsx --test --test-reporter=tap apps/agent/test/*.test.ts > agent.tap
          node --import tsx --test --test-reporter=tap apps/api/test/*.test.ts > api.tap
          node --import tsx --test --test-reporter=tap packages/shared/test/*.test.ts > shared.tap
          node - <<'NODE'
          const fs = require('node:fs');
          let tests = 0;
          let skipped = 0;
          let failed = 0;
          for (const file of ['agent.tap', 'api.tap', 'shared.tap']) {
            const text = fs.readFileSync(file, 'utf8');
            tests += Number(text.match(/^# tests (\d+)/m)?.[1] ?? 0);
            skipped += Number(text.match(/^# skipped (\d+)/m)?.[1] ?? 0);
            // `?? 0` is doing real work on the other two lines and would be a hole on this one: a TAP
            // file with no fail line is one this check cannot judge, not one with nothing to report.
            const reported = text.match(/^# fail (\d+)/m);
            if (!reported) throw new Error(`${file}: no TAP fail-count summary to judge`);
            failed += Number(reported[1]);
          }
          if (tests !== Number(process.env.CI_EXPECTED_TESTS)) throw new Error(`unexpected test count: ${tests}`);
          if (skipped !== Number(process.env.CI_EXPECTED_SKIPS)) throw new Error(`unexpected skipped tests: ${skipped}`);
          // Read from the TAP rather than left to `set -e` and the runner exit codes above, for the
          // same reason the Linux gate does it: the artifact is the thing that gets kept and read.
          if (failed !== 0) throw new Error(`failing tests on Windows: ${failed}`);
          NODE

  verify:
    runs-on: ubuntu-latest
    # MongoDB is started as a STEP, not a `services:` container, because a service container cannot be
    # given command arguments -- the schema allows image/env/ports/volumes/options and no `command` --
    # and a replica set requires `mongod --replSet`. A standalone mongod refuses multi-document
    # transactions outright, and every method of the review-gate durable store is one, so on a
    # standalone its conformance suite can only skip. See "Start MongoDB" below.
    defaults:
      run:
        working-directory: control-center
    env:
      CONTROL_CENTER_RUN_DB_TESTS: "true"
      CONTROL_CENTER_RUN_PRIVILEGED_FS_TESTS: "true"
      CONTROL_CENTER_RUN_DOCKER_DEPLOYMENT_TESTS: "true"
      MONGO_URL_TEST: mongodb://127.0.0.1:27017/control_center_test_ci
      CONTROL_CENTER_DB_TEST_DIAGNOSTICS_FILE: /tmp/control-center-db-test-diagnostics.jsonl
      # Linux TAP inventory: agent 127 + api 133 + shared 146 + web 34 = 440, 0 skips. Measured on the
      # candidate, not derived. The line this replaces read "agent 64 + API 108 + shared 79 + web 34
      # = 285" while the gate below already required api=133 and 310, so that comment had been stale
      # since the buildIdentity work; do not read it as history.
      # agent +26 reviewEnforcement, +37 Forge (attestation, evidence, preflight, credential-leak).
      # shared +3 task-type authorization, +11 billing, +15 authority envelopes, +38 Forge manifest.
      # review-gate 225: NOW COUNTED. The exclusion note this replaces read "deliberately NOT counted
      # here: it carries one documented skip (Mongo conformance needs a replica set) and this gate
      # forbids skips" -- and that reason expired the moment the replica-set step above was added. On
      # Linux the conformance suite RUNS, so the suite reports 0 skips and can be gated like any other.
      # Leaving it out meant the one package this candidate actually changes was the one package whose
      # count nothing checked; a deleted authorization test there would have been invisible.
      # review-gate 251, by the relation that has now held five times:
      #   CI = (local total) - (Mongo skip placeholders) + (conformance cases) + (Mongo-only cases)
      # Here 211 - 3 + 33 + 10 = 251. The third placeholder and two of the Mongo-only cases are the new
      # deployed-API choreography, which stands `apps/api` up against a real database. The Mongo-only file carries 8: two transaction-rollback cases,
      # the legacy-incarnation case, and five concurrency cases that need real transactions. Still a prediction; the gate below is the measurement. An earlier
      # round derived 232 where the truth was 231, which is the entire reason this is checked.
      # The Mongo-only cases skip off CI, which is why this suite could not be gated at all before the
      # replica-set step existed.
      # +12 over the step 15 branch, all of it the payload serialization contract:
      #   shared      +7  serializationContract -- the pinned digest vectors
      #   review-gate +3  attestationService +2 (bind digests the parse) and
      #                   choreographyDeployedApi +1 (a reordered bind still acquires end to end)
      #   agent       +2  the executor digesting its parse, and refusing a payload the schema rejects
      CI_EXPECTED_TEST_SUITES: "agent=134,api=133,review-gate=258,shared=153,web=34"
      CI_EXPECTED_TESTS: "712"
      # A single node IS a replica set: it elects itself primary and honours transactions. The suite
      # requires the string `replicaSet=` in the URI and refuses to run without it, so a green run can
      # no longer be mistaken for one that exercised the durable store.
      REVIEW_GATE_TEST_MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v6
      - name: Start MongoDB as a single-node replica set
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name mongo-rs -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          # `docker run -d` returns as soon as the container is created, which is well before mongod
          # accepts connections; poll rather than sleeping a guessed interval.
          for _ in $(seq 1 45); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          # The member host must be the address the DRIVER will use. The driver reads the replica set
          # config for topology discovery, so naming the container here would hand the runner a
          # hostname it cannot resolve and every connection would hang until timeout.
          docker exec mongo-rs mongosh --quiet --eval             'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          # Election is not instant. Writes and transactions fail until a PRIMARY exists, so wait for
          # one rather than letting the first test absorb the race.
          for _ in $(seq 1 45); do
            if [ "$(docker exec mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null || true)" = "true" ]; then
              echo "replica set rs0 is PRIMARY"
              exit 0
            fi
            sleep 2
          done
          echo "mongod never reached PRIMARY" >&2
          docker logs mongo-rs >&2 || true
          exit 1
      - name: Scan tracked repository content with Gitleaks 8.30.1
        working-directory: .
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tool_dir="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          scan_dir="${RUNNER_TEMP}/gitleaks-tracked-tree"
          mkdir -p "${tool_dir}" "${scan_dir}"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${asset}" "${release_url}/${asset}"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/gitleaks-checksums.txt" \
            "${release_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" "${RUNNER_TEMP}/gitleaks-checksums.txt" \
            > "${RUNNER_TEMP}/gitleaks-checksum.txt"
          (cd "${RUNNER_TEMP}" && sha256sum --check gitleaks-checksum.txt)
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${tool_dir}" gitleaks
          git archive --format=tar HEAD | tar -xf - -C "${scan_dir}"
          "${tool_dir}/gitleaks" dir "${scan_dir}" \
            --no-banner --redact --exit-code 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-center/package-lock.json
      - run: npm ci
      - name: Verify shell bytes and Bash syntax
        run: node scripts/verify-shell-scripts.mjs --require-bash
      - name: Audit production dependencies
        env:
          # PINNED EXACTLY, like Gitleaks, so the gate cannot change under us.
          #
          # Node 22 bundles npm 10, which posts to `/-/npm/v1/security/audits/quick` -- the endpoint npm
          # is retiring. On 2026-09-03 it answered `400 Bad Request` and turned `verify` red on `main` at
          # a commit that had passed an hour earlier; the failure read like a dependency regression and
          # was not one. npm 11 queries `/-/npm/v1/security/advisories/bulk`, which answers for this tree.
          AUDIT_NPM_VERSION: "11.16.0"
        run: |
          set -uo pipefail
          report="${RUNNER_TEMP}/npm-audit.json"
          # Retry ONLY a registry outage. Exit 1 means a real high/critical advisory, and retrying that
          # would just delay the same answer three times.
          status=2
          for attempt in 1 2 3; do
            npx --yes "npm@${AUDIT_NPM_VERSION}" audit --json > "${report}" 2> "${RUNNER_TEMP}/npm-audit.err" || true
            node deploy/scripts/audit-gate.mjs "${report}"
            status=$?
            if [ "${status}" -ne 2 ]; then break; fi
            echo "attempt ${attempt}: the audit did not run; retrying"
            sed -n '1,5p' "${RUNNER_TEMP}/npm-audit.err" || true
            sleep $((attempt * 10))
          done
          if [ "${status}" -eq 2 ]; then
            echo "::error::The dependency audit could not run. This is NOT a clean result -- the gate"
            echo "::error::refuses rather than passing on an audit that never happened."
          fi
          exit "${status}"
      # WHAT THE RUN ACTUALLY TALKED TO, captured before the suites rather than asserted after them.
      #
      # An independent reviewer asked for a retained, independently inspectable record of the MongoDB
      # run, and the reason is specific: this job's whole claim rests on the review-gate suite reaching a
      # REPLICA SET. Against a standalone mongod every method of the durable store is a multi-document
      # transaction and can only skip, so a green run against the wrong topology looks identical to a
      # green run against the right one from outside. The skip gate below catches that today -- but only
      # by inference, and only for whoever reads the log while it is still there.
      #
      # This writes what a third party would otherwise have to take on trust: the server version, the
      # replica-set name and members as the DRIVER will read them for topology discovery, whether this
      # member is actually writable, and the URI the suites were handed.
      - name: Record the MongoDB topology this run used
        working-directory: .
        run: |
          set -euo pipefail
          docker exec mongo-rs mongosh --quiet --eval '
            JSON.stringify({
              capturedAt: new Date().toISOString(),
              serverVersion: db.version(),
              hello: {
                setName: db.hello().setName,
                isWritablePrimary: db.hello().isWritablePrimary,
                hosts: db.hello().hosts,
                maxWireVersion: db.hello().maxWireVersion,
              },
              config: { _id: rs.conf()._id, members: rs.conf().members.map((m) => m.host) },
              status: rs.status().members.map((m) => ({ name: m.name, stateStr: m.stateStr })),
            }, null, 2)
          ' > "${RUNNER_TEMP}/mongo-topology.json"
          # Echoed as well as retained: the artifact is for a reviewer, the log is for whoever is
          # looking at a red run right now.
          cat "${RUNNER_TEMP}/mongo-topology.json"
          # The URI the suites are given, recorded beside the topology so the two can be compared
          # without knowing this workflow. It carries no credentials -- see the env block above.
          echo "$REVIEW_GATE_TEST_MONGO_URL" > "${RUNNER_TEMP}/review-gate-mongo-url.txt"
      - name: Test with disposable MongoDB
        run: npm test
      - name: Retain value-safe database timeout diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: database-integration-diagnostics
          path: /tmp/control-center-db-test-diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 7
      # RUNS EVEN AFTER A RED `npm test`, because this step is what writes the evidence the upload
      # below retains, and a failing run is exactly when a reviewer needs to read it. Skipping it on
      # failure is how a job that broke leaves behind nothing but a log that ages out.
      - name: Verify Linux test summary has no skips
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test scripts/summarize-tap.test.mjs
          # EVERY suite runs even when an earlier one fails. `set -e` would abandon the step at the
          # first red suite and the later TAP files -- including review-gate's, the only record that
          # the Mongo cases reached a replica set -- would never be written at all. The suite exit
          # codes are collected rather than obeyed, and they are NOT the gate: summarize-tap.mjs reads
          # `# fail` out of the TAP itself, so what is judged is the artifact that gets retained.
          status=0
          (cd apps/agent && node --import tsx --test --test-reporter=tap test/*.test.ts) > agent.tap || status=1
          (cd apps/api && node --import tsx --test --test-reporter=tap test/*.test.ts) > api.tap || status=1
          (cd packages/shared && node --import tsx --test --test-reporter=tap test/*.test.ts) > shared.tap || status=1
          (cd apps/web && node --import tsx --test --test-reporter=tap test/*.test.ts test/*.test.tsx) > web.tap || status=1
          # REVIEW_GATE_TEST_MONGO_URL is job-level env, so this run reaches the replica set and the
          # Mongo conformance cases execute here too. If it ever silently fell back to skipping, the
          # skip gate below would fail rather than let a smaller suite pass as green.
          (cd apps/review-gate && node --import tsx --test --test-reporter=tap test/*.test.ts) > review-gate.tap || status=1
          node scripts/summarize-tap.mjs agent=agent.tap api=api.tap review-gate=review-gate.tap shared=shared.tap web=web.tap || status=1
          exit "${status}"
      # RETAINED WHETHER OR NOT THE GATE PASSED, which is the half that matters. The TAP is the only
      # per-case record this job produces: it names every test and its ok/not-ok, so a reviewer can see
      # that a specific case ran rather than inferring it from a count. On a RED run it is the evidence
      # of which case failed and how, after the log has aged out. The counts above are a summary of this
      # file; retaining only the summary is how a suite that quietly stopped running a case still looks
      # green.
      - name: Retain the Linux TAP output and the MongoDB topology it ran against
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-test-evidence
          path: |
            control-center/*.tap
            ${{ runner.temp }}/mongo-topology.json
            ${{ runner.temp }}/review-gate-mongo-url.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Linux agent upgrade and rollback dry run
        run: bash scripts/linux-agent-upgrade-dry-run.sh
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticated browser end-to-end tests
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_URL: http://127.0.0.1:3000
          MONGO_URL_TEST: mongodb://127.0.0.1:27017/control_center_e2e_ci
          UI_SCREENSHOT_DIR: ${{ runner.temp }}/ui-screenshots
        run: |
          set -euo pipefail
          session_secret="$(openssl rand -hex 32)"
          csrf_secret="$(openssl rand -hex 32)"
          encryption_key="$(openssl rand -base64 32)"
          NODE_ENV=development PORT=3000 \
            MONGO_URL="$MONGO_URL_TEST" CONTROL_CENTER_DB=control_center_e2e_ci \
            CONTROL_CENTER_WEB_ORIGIN="$E2E_BASE_URL" CONTROL_CENTER_BOOTSTRAP_MODE=manual \
            CONTROL_CENTER_SESSION_SECRET="$session_secret" CONTROL_CENTER_CSRF_SECRET="$csrf_secret" \
            CONTROL_CENTER_ENCRYPTION_KEY="$encryption_key" AI_ASSISTANT_ENABLED=false \
            npm run dev --workspace @control-center/api >"$RUNNER_TEMP/control-center-api.log" 2>&1 &
          api_pid=$!
          npm run dev --workspace @control-center/web >"$RUNNER_TEMP/control-center-web.log" 2>&1 &
          web_pid=$!
          cleanup() {
            kill "$api_pid" "$web_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null && \
              curl --fail --silent http://127.0.0.1:5173/ >/dev/null && break
            if [ "$attempt" -eq 60 ]; then
              sed -E 's/([A-Z0-9_]*(TOKEN|SECRET|PASSWORD|KEY)[A-Z0-9_]*=)[^ ]+/\\1[REDACTED]/g' "$RUNNER_TEMP/control-center-api.log" >&2
              sed -E 's/([A-Z0-9_]*(TOKEN|SECRET|PASSWORD|KEY)[A-Z0-9_]*=)[^ ]+/\\1[REDACTED]/g' "$RUNNER_TEMP/control-center-web.log" >&2
              exit 1
            fi
            sleep 1
          done
          npm run test:e2e:authenticated
      - name: Retain authenticated browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: authenticated-browser-e2e-failure
          path: ${{ runner.temp }}/authenticated-e2e-failure.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve UI-polish review screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-polish-screenshots
          path: ${{ runner.temp }}/ui-screenshots
          if-no-files-found: warn
          retention-days: 30
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build --workspaces --if-present
      - name: Verify tracked repository integrity
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet --ignore-submodules --; then
            echo "Tracked working-tree changes were produced during validation:"
            git diff --name-only
            exit 1
          fi
          if ! git diff --cached --quiet --ignore-submodules --; then
            echo "Staged tracked changes were produced during validation:"
            git diff --cached --name-only
            exit 1
          fi
