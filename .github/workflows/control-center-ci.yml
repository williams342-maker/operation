name: Control Center CI

on:
  workflow_dispatch:
  pull_request:
  push:
    # `review/**` absorbed from the deleted ci.yml, which was the only workflow triggering on it.
    branches: [ main, checkpoint/local-dashboard-prototype, control-center-phase-1, "validation/**", "fix/**", "review/**" ]

jobs:
  archive-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify checkout shell bytes on Windows
        run: node control-center/scripts/verify-shell-scripts.mjs
      - name: Build exact-commit deployment archive on Windows
        run: node control-center/scripts/build-deployment-archive.mjs --commit "${{ github.sha }}" --output archive-output
      - uses: actions/upload-artifact@v6
        with:
          name: deployment-archive-windows-${{ github.sha }}
          path: archive-output/
          if-no-files-found: error
          compression-level: 0

  archive-linux-verify:
    needs: archive-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: deployment-archive-windows-${{ github.sha }}
          path: archive-output
      - name: Verify Windows archive against Git blobs on Linux
        run: |
          set -euo pipefail
          archive="archive-output/opsworkbench-${GITHUB_SHA:0:12}.tar.gz"
          manifest="archive-output/opsworkbench-${GITHUB_SHA:0:12}.integrity.json"
          node control-center/scripts/verify-deployment-archive.mjs --archive "$archive" --manifest "$manifest"
          mkdir extracted
          tar -xzf "$archive" -C extracted
          bash -n extracted/control-center/apps/web/public/install.sh
          test "$(sha256sum extracted/control-center/apps/web/public/install.sh | cut -d' ' -f1)" = "$(git cat-file blob "$GITHUB_SHA:control-center/apps/web/public/install.sh" | sha256sum | cut -d' ' -f1)"

  # Absorbed from the deleted ci.yml, which was NOT redundant despite looking it.
  #
  # `verify` below runs with RUN_PRIVILEGED_FS_TESTS and RUN_DOCKER_DEPLOYMENT_TESTS enabled and requires
  # ZERO skips. This job runs the same suites with those capabilities DELIBERATELY ABSENT and requires
  # EXACTLY THREE skips. It is the only run that proves the capability-gated tests actually skip when the
  # capability is missing: a test that FAILED rather than skipped without Docker would sail through
  # `verify`, because Docker is present there.
  #
  # The duplicated parts of the old workflow - typecheck, lint, build - are not repeated here; `verify`
  # already covers them. What remains is only the coverage that existed nowhere else.
  quick-verify:
    # Check name kept stable so anyone watching `quick-verify` sees no change.
    name: quick-verify
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: control-center
    env:
      CONTROL_CENTER_RUN_DB_TESTS: "true"
      # PRIVILEGED_FS and DOCKER_DEPLOYMENT are intentionally NOT set. That absence is the point of this
      # job; setting them would make it a duplicate of `verify` and delete the coverage it exists for.
      MONGO_URL_TEST: mongodb://127.0.0.1:27017/control_center_test_ci
      # agent 127 + api 133 + shared 146 = 406, with exactly 3 skips: the docker-deployment test and two
      # privileged linuxDiscovery tests. Both numbers must move together when tests are added.
      CI_EXPECTED_TESTS: "406"
      CI_EXPECTED_SKIPS: "3"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-center/package-lock.json
      - run: npm ci
      # The agent and api suites import @control-center/shared by its BUILT output, so the dist must
      # exist before they can even load. The deleted ci.yml got this for free from `npm test`, whose
      # pretest builds it; dropping that step as "duplicated work" removed the build too and the suites
      # failed to import rather than running.
      - name: Build the shared package the suites import
        run: npm run build --workspace @control-center/shared
      - name: Verify capability-gated tests skip rather than fail when the capability is absent
        run: |
          set -euo pipefail
          node --import tsx --test --test-reporter=tap apps/agent/test/*.test.ts > agent.tap
          node --import tsx --test --test-reporter=tap apps/api/test/*.test.ts > api.tap
          node --import tsx --test --test-reporter=tap packages/shared/test/*.test.ts > shared.tap
          node - <<'NODE'
          const fs = require('node:fs');
          let tests = 0;
          let skipped = 0;
          for (const file of ['agent.tap', 'api.tap', 'shared.tap']) {
            const text = fs.readFileSync(file, 'utf8');
            tests += Number(text.match(/^# tests (\d+)/m)?.[1] ?? 0);
            skipped += Number(text.match(/^# skipped (\d+)/m)?.[1] ?? 0);
          }
          if (tests !== Number(process.env.CI_EXPECTED_TESTS)) throw new Error(`unexpected test count: ${tests}`);
          if (skipped !== Number(process.env.CI_EXPECTED_SKIPS)) throw new Error(`unexpected skipped tests: ${skipped}`);
          NODE

  verify:
    runs-on: ubuntu-latest
    # MongoDB is started as a STEP, not a `services:` container, because a service container cannot be
    # given command arguments -- the schema allows image/env/ports/volumes/options and no `command` --
    # and a replica set requires `mongod --replSet`. A standalone mongod refuses multi-document
    # transactions outright, and every method of the review-gate durable store is one, so on a
    # standalone its conformance suite can only skip. See "Start MongoDB" below.
    defaults:
      run:
        working-directory: control-center
    env:
      CONTROL_CENTER_RUN_DB_TESTS: "true"
      CONTROL_CENTER_RUN_PRIVILEGED_FS_TESTS: "true"
      CONTROL_CENTER_RUN_DOCKER_DEPLOYMENT_TESTS: "true"
      MONGO_URL_TEST: mongodb://127.0.0.1:27017/control_center_test_ci
      CONTROL_CENTER_DB_TEST_DIAGNOSTICS_FILE: /tmp/control-center-db-test-diagnostics.jsonl
      # Linux TAP inventory: agent 127 + api 133 + shared 146 + web 34 = 440, 0 skips. Measured on the
      # candidate, not derived. The line this replaces read "agent 64 + API 108 + shared 79 + web 34
      # = 285" while the gate below already required api=133 and 310, so that comment had been stale
      # since the buildIdentity work; do not read it as history.
      # agent +26 reviewEnforcement, +37 Forge (attestation, evidence, preflight, credential-leak).
      # shared +3 task-type authorization, +11 billing, +15 authority envelopes, +38 Forge manifest.
      # The review-gate suite (174) runs under `npm test` but is deliberately NOT counted here: it
      # carries one documented skip (Mongo conformance needs a replica set) and this gate forbids skips.
      CI_EXPECTED_TEST_SUITES: "agent=127,api=133,shared=146,web=34"
      CI_EXPECTED_TESTS: "440"
      # A single node IS a replica set: it elects itself primary and honours transactions. The suite
      # requires the string `replicaSet=` in the URI and refuses to run without it, so a green run can
      # no longer be mistaken for one that exercised the durable store.
      REVIEW_GATE_TEST_MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v6
      - name: Start MongoDB as a single-node replica set
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name mongo-rs -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          # `docker run -d` returns as soon as the container is created, which is well before mongod
          # accepts connections; poll rather than sleeping a guessed interval.
          for _ in $(seq 1 45); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          # The member host must be the address the DRIVER will use. The driver reads the replica set
          # config for topology discovery, so naming the container here would hand the runner a
          # hostname it cannot resolve and every connection would hang until timeout.
          docker exec mongo-rs mongosh --quiet --eval             'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          # Election is not instant. Writes and transactions fail until a PRIMARY exists, so wait for
          # one rather than letting the first test absorb the race.
          for _ in $(seq 1 45); do
            if [ "$(docker exec mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null || true)" = "true" ]; then
              echo "replica set rs0 is PRIMARY"
              exit 0
            fi
            sleep 2
          done
          echo "mongod never reached PRIMARY" >&2
          docker logs mongo-rs >&2 || true
          exit 1
      - name: Scan tracked repository content with Gitleaks 8.30.1
        working-directory: .
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tool_dir="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          scan_dir="${RUNNER_TEMP}/gitleaks-tracked-tree"
          mkdir -p "${tool_dir}" "${scan_dir}"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${asset}" "${release_url}/${asset}"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/gitleaks-checksums.txt" \
            "${release_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" "${RUNNER_TEMP}/gitleaks-checksums.txt" \
            > "${RUNNER_TEMP}/gitleaks-checksum.txt"
          (cd "${RUNNER_TEMP}" && sha256sum --check gitleaks-checksum.txt)
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${tool_dir}" gitleaks
          git archive --format=tar HEAD | tar -xf - -C "${scan_dir}"
          "${tool_dir}/gitleaks" dir "${scan_dir}" \
            --no-banner --redact --exit-code 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-center/package-lock.json
      - run: npm ci
      - name: Verify shell bytes and Bash syntax
        run: node scripts/verify-shell-scripts.mjs --require-bash
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - name: Test with disposable MongoDB
        run: npm test
      - name: Retain value-safe database timeout diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: database-integration-diagnostics
          path: /tmp/control-center-db-test-diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Linux test summary has no skips
        run: |
          set -euo pipefail
          node --test scripts/summarize-tap.test.mjs
          (cd apps/agent && node --import tsx --test --test-reporter=tap test/*.test.ts) > agent.tap
          (cd apps/api && node --import tsx --test --test-reporter=tap test/*.test.ts) > api.tap
          (cd packages/shared && node --import tsx --test --test-reporter=tap test/*.test.ts) > shared.tap
          (cd apps/web && node --import tsx --test --test-reporter=tap test/*.test.ts test/*.test.tsx) > web.tap
          node scripts/summarize-tap.mjs agent=agent.tap api=api.tap shared=shared.tap web=web.tap
      - name: Linux agent upgrade and rollback dry run
        run: bash scripts/linux-agent-upgrade-dry-run.sh
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticated browser end-to-end tests
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_URL: http://127.0.0.1:3000
          MONGO_URL_TEST: mongodb://127.0.0.1:27017/control_center_e2e_ci
          UI_SCREENSHOT_DIR: ${{ runner.temp }}/ui-screenshots
        run: |
          set -euo pipefail
          session_secret="$(openssl rand -hex 32)"
          csrf_secret="$(openssl rand -hex 32)"
          encryption_key="$(openssl rand -base64 32)"
          NODE_ENV=development PORT=3000 \
            MONGO_URL="$MONGO_URL_TEST" CONTROL_CENTER_DB=control_center_e2e_ci \
            CONTROL_CENTER_WEB_ORIGIN="$E2E_BASE_URL" CONTROL_CENTER_BOOTSTRAP_MODE=manual \
            CONTROL_CENTER_SESSION_SECRET="$session_secret" CONTROL_CENTER_CSRF_SECRET="$csrf_secret" \
            CONTROL_CENTER_ENCRYPTION_KEY="$encryption_key" AI_ASSISTANT_ENABLED=false \
            npm run dev --workspace @control-center/api >"$RUNNER_TEMP/control-center-api.log" 2>&1 &
          api_pid=$!
          npm run dev --workspace @control-center/web >"$RUNNER_TEMP/control-center-web.log" 2>&1 &
          web_pid=$!
          cleanup() {
            kill "$api_pid" "$web_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null && \
              curl --fail --silent http://127.0.0.1:5173/ >/dev/null && break
            if [ "$attempt" -eq 60 ]; then
              sed -E 's/([A-Z0-9_]*(TOKEN|SECRET|PASSWORD|KEY)[A-Z0-9_]*=)[^ ]+/\\1[REDACTED]/g' "$RUNNER_TEMP/control-center-api.log" >&2
              sed -E 's/([A-Z0-9_]*(TOKEN|SECRET|PASSWORD|KEY)[A-Z0-9_]*=)[^ ]+/\\1[REDACTED]/g' "$RUNNER_TEMP/control-center-web.log" >&2
              exit 1
            fi
            sleep 1
          done
          npm run test:e2e:authenticated
      - name: Retain authenticated browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: authenticated-browser-e2e-failure
          path: ${{ runner.temp }}/authenticated-e2e-failure.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve UI-polish review screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-polish-screenshots
          path: ${{ runner.temp }}/ui-screenshots
          if-no-files-found: warn
          retention-days: 30
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build --workspaces --if-present
      - name: Verify tracked repository integrity
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet --ignore-submodules --; then
            echo "Tracked working-tree changes were produced during validation:"
            git diff --name-only
            exit 1
          fi
          if ! git diff --cached --quiet --ignore-submodules --; then
            echo "Staged tracked changes were produced during validation:"
            git diff --cached --name-only
            exit 1
          fi
