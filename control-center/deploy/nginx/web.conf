server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── SECURITY HEADERS: this container is the AUTHORITY for its own responses ──────────────────────
  #
  # Exactly one layer sets each header, and it is the layer that knows what it is serving. The edge
  # (deploy/nginx/edge-container.conf) and the TLS terminator (deploy/nginx/staging.conf) deliberately
  # do NOT re-add these, because nginx appends add_header to proxied responses and they would stack.
  # The live site was emitting three copies of X-Content-Type-Options, Referrer-Policy and
  # X-Frame-Options, and two conflicting Content-Security-Policy headers.
  #
  # ⚠ nginx add_header INHERITANCE: directives from an outer block apply to a location ONLY IF that
  # location declares no add_header of its own. A location that adds Cache-Control therefore silently
  # DISCARDS every security header above it. Both locations below hit exactly that, and the duplication
  # at the edge was masking it — the built JS/CSS bundles and install.sh were relying on a downstream
  # layer to re-add what this one had dropped.
  #
  # So every location that sets any add_header MUST restate the full set. That repetition is load
  # bearing. Do not "tidy" it away.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Cache-Control "no-store" always;

  location / {
    try_files $uri /index.html;
  }

  location = /install.sh {
    try_files /install.sh =404;
    default_type text/x-shellscript;
    # Full set restated — see the inheritance note above. This response is a script people download and
    # inspect; losing nosniff here is the worst place to lose it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
  }

  location ~* \.(?:js|css|woff2?)$ {
    try_files $uri =404;
    # Full set restated — see the inheritance note above. Content-Security-Policy is omitted here on
    # purpose: it governs documents, not subresources, and these are never navigated to directly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
