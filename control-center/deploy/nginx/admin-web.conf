resolver 127.0.0.11 valid=10s ipv6=off;

upstream opsworkbench_admin_api {
  zone opsworkbench_admin_api 64k;
  server api:3000 resolve;
}

server {
  listen 8080;
  server_name admin.opsworkbench.org;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  location = /admin-healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header CF-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_pass http://opsworkbench_admin_api;
  }

  location / {
    try_files $uri /index.html;
  }

  # EVERY header this location wants is repeated here, including the four that look like they are
  # already set above. nginx's add_header does not accumulate down the tree: a location that sets ANY
  # add_header replaces the whole inherited set rather than adding to it. Setting two here silently
  # dropped the other four, and the effect was live -- measured against the running container, not
  # inferred from the config:
  #
  #   GET /                     -> nosniff, Referrer-Policy, X-Frame-Options, Cache-Control, X-Robots-Tag
  #   GET /assets/index-*.js    -> Cache-Control, X-Robots-Tag        (and nothing else)
  #
  # So the admin console's JavaScript and stylesheets were served without X-Content-Type-Options while
  # its HTML was served with it. Only Cache-Control is genuinely overridden here; the rest of the
  # repetition exists to keep what the server block already decided.
  location ~* \.(?:js|css|woff2?)$ {
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }
}

server {
  listen 8080 default_server;
  server_name _;
  location = /admin-healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
  location / { return 444; }
}
