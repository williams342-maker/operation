resolver 127.0.0.11 valid=10s ipv6=off;

upstream opsworkbench_admin_api {
  zone opsworkbench_admin_api 64k;
  server api:3000 resolve;
}

server {
  listen 8080;
  server_name admin.opsworkbench.org;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  # ── SECURITY HEADERS: SET PER LOCATION, DELIBERATELY NOT ON THE SERVER BLOCK ─────────────────────
  #
  # This file differs from web.conf in one way that changes the answer: it PROXIES /api/. nginx appends
  # add_header to proxied responses, and the API sets its own via helmet, so a server-level header here
  # is emitted twice. Measured through the running container on 2026-09-05, GET /api/healthz returned
  # X-Content-Type-Options, Referrer-Policy and X-Frame-Options TWICE -- once from the API, once
  # appended here. That is the duplication work-order W7 removed from the public site, still present on
  # this origin because this file was never in the repository to be fixed with it.
  #
  # nginx has no way to un-set an inherited add_header in one location, so the fix is structural: the
  # server block owns nothing, and each location that serves a response NGINX ITSELF generates restates
  # the full set. /api/ sets none, because the API owns its own responses.
  #
  # ⚠ The same inheritance rule still applies within this file: a location that declares ANY add_header
  # discards every one it would have inherited. The repetition below is load bearing. Do not tidy it.
  #
  # No Content-Security-Policy is set for admin documents, here or previously. That is a real gap and
  # it is left alone on purpose: a CSP for this console cannot be exercised from outside it, and a
  # wrong one breaks the page. It is called out in the PR rather than guessed at here.

  location = /admin-healthz {
    access_log off;
    default_type text/plain;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 200 "ok\n";
  }

  # No add_header: the API sets its own and nginx would append a second copy of each.
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header CF-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_pass http://opsworkbench_admin_api;
  }

  location / {
    try_files $uri /index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location ~* \.(?:js|css|woff2?)$ {
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }
}

server {
  listen 8080 default_server;
  server_name _;
  location = /admin-healthz {
    access_log off;
    default_type text/plain;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 200 "ok\n";
  }
  location / { return 444; }
}
