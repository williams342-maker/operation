server {
  listen 8080;
  server_name _;
  client_max_body_size 1m;

  # SECURITY HEADERS: none. This block is a pure proxy and owns no response content, so it is not the
  # authority for any header describing that content. nginx APPENDS add_header to proxied responses, so
  # re-adding what the api container (helmet) and the web container (web.conf) already set produced
  # duplicates — three copies of X-Content-Type-Options, Referrer-Policy and X-Frame-Options were
  # observed live. Both upstreams set the full set themselves; do not re-add here.

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_pass http://api:3000/api/;
  }

  location /healthz {
    proxy_pass http://api:3000/healthz;
  }

  location /readyz {
    proxy_pass http://api:3000/readyz;
  }

  location / {
    proxy_pass http://web:8080;
  }
}
