resolver 127.0.0.11 valid=10s ipv6=off;

upstream opsworkbench_api {
  zone opsworkbench_api 64k;
  server api:3000 resolve;
}

upstream opsworkbench_web {
  zone opsworkbench_web 64k;
  server web:8080 resolve;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_pass http://opsworkbench_api;
  }

  location /healthz {
    proxy_pass http://opsworkbench_api;
  }

  location /readyz {
    proxy_pass http://opsworkbench_api;
  }

  location / {
    proxy_pass http://opsworkbench_web;
  }
}
