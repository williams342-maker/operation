# Install at /etc/nginx/conf.d/control-center-staging.conf on the staging host.
# Replace control.example.com with the staging hostname.
limit_req_zone $binary_remote_addr zone=cc_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=cc_agent:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=cc_default:10m rate=120r/m;

map $http_x_request_id $request_id_forwarded {
  default $http_x_request_id;
  "" $request_id;
}

log_format control_center '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" request_id=$request_id_forwarded';

server {
  listen 80;
  server_name control.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name control.example.com;

  ssl_certificate /etc/letsencrypt/live/control.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/control.example.com/privkey.pem;

  access_log /var/log/nginx/control-center-access.log control_center;
  error_log /var/log/nginx/control-center-error.log warn;

  client_max_body_size 1m;
  server_tokens off;

  # SECURITY HEADERS: HSTS ONLY.
  #
  # This is the TLS terminator, so it is the only layer that can meaningfully assert HSTS — and the only
  # one that should. Everything else is set by the layer that owns the response: helmet in the API for
  # /api, /healthz and /readyz, and web.conf in the web container for static documents.
  #
  # X-Content-Type-Options, Referrer-Policy, X-Frame-Options and Content-Security-Policy were removed
  # from here because nginx appends add_header to proxied responses: the live site emitted three copies
  # of the first three and TWO CONFLICTING Content-Security-Policy headers.
  #
  # Note on what that CSP was doing: it omitted font-src, so it fell back to default-src 'self', while
  # helmet sets font-src 'self' https: data:. Browsers enforce every CSP header they receive, so the
  # EFFECTIVE font-src was the intersection — 'self'. Deleting this header alone would therefore have
  # loosened font-src to any https origin. helmet's font-src has been tightened to 'self' in the same
  # change so the effective policy is unchanged.
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Request-ID $request_id_forwarded;
  proxy_hide_header X-Powered-By;

  location = /api/auth/login {
    limit_req zone=cc_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:18080;
  }

  location ^~ /api/enrollments {
    limit_req zone=cc_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:18080;
  }

  location ^~ /api/agent/ {
    limit_req zone=cc_agent burst=30 nodelay;
    proxy_pass http://127.0.0.1:18080;
  }

  location / {
    limit_req zone=cc_default burst=60 nodelay;
    proxy_pass http://127.0.0.1:18080;
  }
}
