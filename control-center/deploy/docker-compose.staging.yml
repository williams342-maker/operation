services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: control-center-api:staging
    env_file:
      - ./env/.env.staging
    environment:
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    image: control-center-web:staging
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  edge:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./nginx/edge-container.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    command: ["mongod", "--bind_ip", "127.0.0.1,mongo"]
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  internal:
    driver: bridge

volumes:
  mongo_data:
