services:
  api:
    image: ${OPSWORKBENCH_API_IMAGE:?digest-pinned API image is required}
    env_file:
      - /etc/opsworkbench/control-center.env
    environment:
      PORT: "3000"
      NODE_ENV: production
    volumes:
      - /opt/opsworkbench/artifacts/agent/approved-source.tar.gz:/run/opsworkbench-artifacts/agent-source.tar.gz:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  web:
    image: ${OPSWORKBENCH_WEB_IMAGE:?digest-pinned web image is required}
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  admin:
    image: ${OPSWORKBENCH_ADMIN_IMAGE:?digest-pinned admin-web image is required}
    ports:
      - "127.0.0.1:18081:8080"
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  review-gate:
    image: ${OPSWORKBENCH_REVIEW_GATE_IMAGE:?digest-pinned Review Gate image is required}
    env_file:
      - /etc/opsworkbench/review-gate.env
    environment:
      REVIEW_GATE_BIND: "0.0.0.0"
      REVIEW_GATE_PORT: "3100"
      REVIEW_GATE_TLS_CERTIFICATE_PATH: "/run/review-gate-tls/tls.crt"
      REVIEW_GATE_TLS_PRIVATE_KEY_PATH: "/run/review-gate-tls/tls.key"
    volumes:
      - /etc/opsworkbench/review-gate-tls:/run/review-gate-tls:ro
    ports:
      - "127.0.0.1:13100:3100"
    depends_on:
      mongo: { condition: service_healthy }
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'),https=require('https');https.get({host:'127.0.0.1',port:3100,path:'/healthz',ca:fs.readFileSync(process.env.REVIEW_GATE_TLS_CERTIFICATE_PATH),servername:'review-gate',rejectUnauthorized:true},r=>process.exit(r.statusCode>=200&&r.statusCode<300?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  edge:
    image: ${OPSWORKBENCH_EDGE_IMAGE:?digest-pinned edge image is required}
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./nginx/edge-container.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  mongo:
    image: ${OPSWORKBENCH_MONGO_IMAGE:?digest-pinned Mongo image is required}
    command: ["mongod", "--bind_ip", "127.0.0.1,mongo", "--replSet", "opsworkbench-staging-rs"]
    volumes:
      - mongo_data:/data/db
      - ./mongo-replica-set-health.js:/opt/opsworkbench/mongo/replica-set-health.js:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--nodb", "--file", "/opt/opsworkbench/mongo/replica-set-health.js"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  internal:
    driver: bridge

volumes:
  mongo_data:
    name: ${OPSWORKBENCH_MONGO_VOLUME:?existing verified Mongo volume is required}
    external: true
