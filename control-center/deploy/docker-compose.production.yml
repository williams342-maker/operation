services:
  api:
    image: ${OPSWORKBENCH_API_IMAGE:?digest-pinned API image is required}
    env_file:
      - /etc/opsworkbench/control-center.env
    environment:
      PORT: "3000"
      NODE_ENV: production
    volumes:
      - /opt/opsworkbench/artifacts/agent/approved-source.tar.gz:/run/opsworkbench-artifacts/agent-source.tar.gz:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  web:
    image: ${OPSWORKBENCH_WEB_IMAGE:?digest-pinned web image is required}
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  admin:
    image: ${OPSWORKBENCH_ADMIN_IMAGE:?digest-pinned admin-web image is required}
    ports:
      - "127.0.0.1:18081:8080"
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  # The review gate is BUILT, ATTESTED AND BOUND, but it is not run here.
  #
  # This target runs three application services -- api, web, admin -- and has run exactly those since
  # it was stood up. The gate was declared here on the assumption that the four images the release
  # pipeline produces are the four services every target runs. They are not: the image set is a
  # property of the BUILD, the running set is a property of the TARGET.
  #
  # Declaring it anyway was not free. Compose loads and validates the whole project model before it
  # selects services, so this block's required `env_file: /etc/opsworkbench/review-gate.env` had to
  # exist on the host for `compose config` to succeed at all -- for a service that would never be
  # started. It does not exist there, and that alone made every deployment of this file fail during
  # validation, before any container was touched. (The `/etc/opsworkbench/review-gate-tls` mount is
  # also absent, but a missing bind source is not a validation failure; it would have surfaced later,
  # at container creation.)
  #
  # Nothing about provenance is relaxed by removing it. The Forge build document still REQUIRES
  # reviewGateImageDigest, the deployment plan still carries all four candidate and rollback image
  # references, and the deployer still verifies the gate image's attestation, registry digest and
  # labels alongside the other three. The gate is a component this target is not authorized to run,
  # not a component whose provenance stopped mattering.
  #
  # Do not re-add this service to bring a gate online. Running it needs its environment file, its TLS
  # material and an owner decision to enable enforcement. Adding the block back on its own would only
  # reintroduce the validation failure.

  edge:
    image: ${OPSWORKBENCH_EDGE_IMAGE:?digest-pinned edge image is required}
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./nginx/edge-container.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  mongo:
    image: ${OPSWORKBENCH_MONGO_IMAGE:?digest-pinned Mongo image is required}
    command: ["mongod", "--bind_ip", "127.0.0.1,mongo", "--replSet", "opsworkbench-staging-rs"]
    volumes:
      - mongo_data:/data/db
      - ./mongo-replica-set-health.js:/opt/opsworkbench/mongo/replica-set-health.js:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--nodb", "--file", "/opt/opsworkbench/mongo/replica-set-health.js"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  internal:
    driver: bridge

volumes:
  mongo_data:
    name: ${OPSWORKBENCH_MONGO_VOLUME:?existing verified Mongo volume is required}
    external: true
