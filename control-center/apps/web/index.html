<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpsWorkbench — Foundry</title></head><body>
<div id="root"></div>
<script>
  // No-flash theme init: apply the persisted theme before first paint so there is
  // no light/dark flash on load. Mirrors DEFAULT_THEME/THEME_STORAGE_KEY in
  // src/theme.ts (kept in sync deliberately — this runs before any module loads).
  (function () {
    try {
      var stored = localStorage.getItem("cc.theme");
      document.documentElement.dataset.theme = stored === "light" || stored === "dark" ? stored : "dark";
    } catch (error) {
      document.documentElement.dataset.theme = "dark";
    }
  })();
</script>
<script type="module" src="/src/main.tsx"></script>

</body></html>
