<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpsWorkbench — Foundry</title>
<!-- Theme init is a FILE, not an inline script: the CSP serving this app is
     `script-src 'self' …` with no unsafe-inline, nonce or hash, so an inline block is refused
     by the browser and never runs. Plain synchronous <script src> -- no defer, no async, or
     the first paint can beat it and the flash returns. See public/theme-init.js.
     It must also stay in <head>. In <body> it is parser-blocking but NOT render-blocking: the
     browser painted the default (dark) theme while the file was still in flight, measured at
     first-paint 19.5ms vs theme applied 30.5ms on localhost. Only a head script holds the first
     paint until it has run. -->
<script src="/theme-init.js"></script>
</head><body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>

</body></html>
