[pytest]
asyncio_mode = strict
# iter265 — Motor's AsyncIOMotorClient is created at import time in core.py
# and binds to whatever event loop is running. With pytest-asyncio's default
# function-scoped loop, the loop closes after each test → motor raises
# "Event loop is closed" on the next test. Session-scoping both the test
# loop and fixture loop reuses one loop across the whole suite so motor's
# bound loop stays alive.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
testpaths = tests

# iter411c — Pytest marker registry. Suppresses
# "PytestUnknownMarkWarning" and documents what each marker buys us.
markers =
    smoke: green-known-good high-value flows (products, checkout, custom orders,
        maker applications, marketplace core). Pre-deploy CI runs `pytest -m smoke`
        to gate ship-readiness without blocking on slower or rotted tests.
    slow: long-running integration suites (LLM chat, DXF→SVG conversion, bulk R2
        zip uploads, cross-collection mod sweeps). Excluded from the smoke gate
        because each file exceeds the 18-20s budget. Run on demand or in a
        nightly job with `pytest -m slow tests/`.
