<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Crafters Market</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #fafafa; font-family: -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center; height: 100vh; }
    .box { text-align: center; padding: 24px; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #e8b04b; border-radius: 50%; margin: 0 auto 16px;
      animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Loading Crafters Market…</p>
  </div>
</body>
</html>
